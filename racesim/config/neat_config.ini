
[NEAT]
fitness_criterion     = max
fitness_threshold     = 6000
# polulation size
pop_size              = 20
reset_on_extinction   = True
no_fitness_termination = False
[DefaultGenome]
# node activation options
activation_default        = sigmoid
; activation_default      = random
activation_mutate_rate    = 0.05
; activation_options      = sigmoid tanh relu clamped cube gauss softplus exp hat log square
; activation_options      = relu softplus hat gauss exp sigmoid tanh
; activation_options      = tanh cube clamped relu
activation_options        = relu gauss hat softplus
# node aggregation options
; aggregation_default     = max
; aggregation_mutate_rate = 0.02
; aggregation_options     = sum
aggregation_default     = max
aggregation_mutate_rate = 0.02
aggregation_options     = sum mean

# node bias options
bias_init_type          = normal
bias_init_mean          = 0.1
bias_init_stdev         = 1.0
bias_max_value          = 1.0
bias_min_value          = 0.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.05
bias_replace_rate       = 0.01

# genome compatibility options
compatibility_disjoint_coefficient = 1
compatibility_weight_coefficient   = 0.6

# connection add/remove rates
conn_add_prob           = 0.2
conn_delete_prob        = 0.2

# connection enable options
enabled_default           = True
enabled_mutate_rate       = 0.1
enabled_rate_to_true_add  = 0.75
; enabled_rate_to_false_add = 0.05
feed_forward            = True
; initial_connection      = partial_direct 0.25
initial_connection        = full_direct
; initial_connection      = partial_nodirect 0.3
; initial_connection      = full_nodirect


# node add/remove rates
node_add_prob           = 0.5
node_delete_prob        = 0.5

# network parameters
num_hidden              = 1
num_inputs              = 6
num_outputs             = 3

# node response options
response_init_mean      = 0.1
response_init_stdev     = 0.0
response_max_value      = 1.0
response_min_value      = 0.0
response_mutate_power   = 0.5
response_mutate_rate    = 0.05
response_replace_rate   = 0.01
# connection weight options
weight_init_mean        = 0.1
weight_init_stdev       = 1.0
weight_max_value        = 100.0
weight_min_value        = -100.0
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.05
weight_replace_rate     = 0.01

single_structural_mutation = False
structural_mutation_surer = True

[DefaultSpeciesSet]
compatibility_threshold = 2.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 20
species_elitism      = 5

[DefaultReproduction]
elitism            = 4
survival_threshold = 0.2
min_species_size = 2
