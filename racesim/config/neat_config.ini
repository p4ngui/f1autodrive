
[NEAT]
fitness_criterion     = max
fitness_threshold     = 6000
# polulation size
pop_size              = 60
reset_on_extinction   = True
no_fitness_termination = False
[DefaultGenome]
# node activation options
; activation_default      = tanh
activation_default      = random
activation_mutate_rate  = 0.02
# activation_options      = sigmoid tanh relu clamped cube gauss softplus exp hat log square
; activation_options      = relu softplus hat gauss exp sigmoid tanh
activation_options      = tanh clamped cube
; activation_options      = tanh
# node aggregation options
; aggregation_default     = max
; aggregation_mutate_rate = 0.02
; aggregation_options     = sum
aggregation_default     = sum
aggregation_mutate_rate = 0.02
aggregation_options     = max

# node bias options
bias_init_mean          = 0.0
bias_init_stdev         = 1.0
bias_max_value          = 30.0
bias_min_value          = -30.0
bias_mutate_power       = 0.5
bias_mutate_rate        = 0.7
bias_replace_rate       = 0.1

# genome compatibility options
compatibility_disjoint_coefficient = 1
compatibility_weight_coefficient   = 0.6

# connection add/remove rates
conn_add_prob           = 0.5
conn_delete_prob        = 0.49

# connection enable options
enabled_default         = True
enabled_mutate_rate     = 0.05
enabled_rate_to_true_add = 0.75

feed_forward            = True
initial_connection        = full_nodirect
; initial_connection      = partial_nodirect 0.5
# initial_connection      = full_nodirect


# node add/remove rates
node_add_prob           = 0.2
node_delete_prob        = 0.19

# network parameters
num_hidden              = 0
num_inputs              = 6
num_outputs             = 2

# node response options
response_init_mean      = 0.0
response_init_stdev     = 0.0
response_max_value      = 1.0
response_min_value      = -1.0
response_mutate_power   = 0.0
response_mutate_rate    = 0.00
response_replace_rate   = 0.0

# connection weight options
weight_init_mean        = 0.1
weight_init_stdev       = 1.0
weight_max_value        = 30
weight_min_value        = -30
weight_mutate_power     = 0.5
weight_mutate_rate      = 0.8
weight_replace_rate     = 0.1

single_structural_mutation = False
structural_mutation_surer = True

[DefaultSpeciesSet]
compatibility_threshold = 3.0

[DefaultStagnation]
species_fitness_func = max
max_stagnation       = 25
species_elitism      = 1

[DefaultReproduction]
elitism            = 2
survival_threshold = 0.2
min_species_size = 2
